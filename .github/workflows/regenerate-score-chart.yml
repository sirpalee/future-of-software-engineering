name: Regenerate Score Chart

on:
  push:

permissions:
  contents: write

jobs:
  regenerate-chart:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Regenerate chart
        run: uv run python generate_graph.py

      - name: Commit updated chart
        run: |
          if git diff --quiet -- score_chart.png; then
            echo "score_chart.png is unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add score_chart.png
          git commit -m "Update generated score chart [skip ci]"
          git push
